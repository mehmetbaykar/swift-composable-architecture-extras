name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
          - watchOS
        include:
          - platform: iOS
            destination: "platform=iOS Simulator,name=iPhone 17,OS=latest"
          - platform: macOS
            destination: "platform=macOS"
          - platform: watchOS
            destination: "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest"
    steps:
      - uses: actions/checkout@v6

      - name: Skip Macro Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-build-${{ matrix.platform }}-${{ hashFiles('**/Sources/**/*.swift') }}
          restore-keys: deriveddata-build-${{ matrix.platform }}-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ComposableArchitectureExtras \
            -destination '${{ matrix.destination }}' \
            | xcpretty

  test:
    name: Test (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
          - watchOS
        include:
          - platform: iOS
            destination: "platform=iOS Simulator,name=iPhone 17,OS=latest"
          - platform: macOS
            destination: "platform=macOS"
          - platform: watchOS
            destination: "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest"
    steps:
      - uses: actions/checkout@v6

      - name: Skip Macro Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-test-${{ matrix.platform }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
          restore-keys: deriveddata-test-${{ matrix.platform }}-

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ComposableArchitectureExtras \
            -destination '${{ matrix.destination }}' \
            | xcpretty
