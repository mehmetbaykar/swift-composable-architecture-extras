name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
        include:
          - platform: iOS
            destination: "platform=iOS Simulator,name=iPhone 17,OS=latest"
          - platform: macOS
            destination: "platform=macOS"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-build-${{ matrix.platform }}-${{ hashFiles('**/Sources/**/*.swift') }}
          restore-keys: deriveddata-build-${{ matrix.platform }}-

      - name: Build
        run: |
          xcodebuild build \
            -scheme ComposableArchitectureExtras \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            | xcpretty || true

  test:
    name: Test ${{ matrix.scheme }} (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
        scheme:
          - Analytics
          - Filter
          - FormValidation
        include:
          - platform: iOS
            destination: "platform=iOS Simulator,name=iPhone 17,OS=latest"
          - platform: macOS
            destination: "platform=macOS"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ matrix.platform }}-${{ matrix.scheme }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
          restore-keys: |
            deriveddata-${{ matrix.platform }}-${{ matrix.scheme }}-
            deriveddata-${{ matrix.platform }}-

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            | xcpretty || true
