name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS, tvOS, watchOS]
        include:
          - platform: iOS
            destination: "platform=iOS Simulator,name=iPhone 17,OS=latest"
          - platform: macOS
            destination: "platform=macOS"
          - platform: tvOS
            destination: "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest"
          - platform: watchOS
            destination: "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: .derivedData
          key: deriveddata-${{ matrix.platform }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            deriveddata-${{ matrix.platform }}-

      - name: Download Simulator Runtime
        if: matrix.platform == 'watchOS' || matrix.platform == 'tvOS'
        run: |
          sudo xcodebuild -runFirstLaunch
          xcodebuild -downloadPlatform ${{ matrix.platform }}

      - name: Update xcbeautify
        run: brew update && brew upgrade xcbeautify

      - name: Configure Xcode Build Settings
        run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Build Library
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ComposableArchitectureExtras \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme AllTests \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify
